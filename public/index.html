<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pathfinder: find your path in tech</title>
  <meta name="description" content="Free guidance for college students to understand their syllabus, set career goals, and learn with mentors.">
  <meta name="theme-color" content="#f5b82e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/home" aria-label="Pathfinder home">
        <b>Pathfinder</b>
        <span id="tagline"></span>
        <i class="dash" aria-hidden="true"></i>
      </a>
      <div class="top-tools">
        <button class="btn ghost small" id="install" hidden type="button"></button>
        <label class="sr" for="lang" id="lang-label">Language</label>
        <select class="lang" id="lang"></select>
      </div>
    </div>
  </header>
  <div class="banner" id="offline" role="status" hidden></div>

  <main id="main" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>

  <nav class="nav" id="nav" aria-label="Main">
    <div class="nav-in">
      <a href="#/home" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-i="nav_home"></span>
      </a>
      <a href="#/paths" data-nav="paths">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M12 6h7l2 2.5-2 2.5h-7M12 13H5l-2 2.5L5 18h7"/></svg>
        <span data-i="nav_paths"></span>
      </a>
      <a href="#/plan" data-nav="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5zM9 9l2 2 4-4M9 15h6"/></svg>
        <span data-i="nav_plan"></span>
      </a>
      <a href="#/guide" data-nav="guide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
        <span data-i="nav_guide"></span>
      </a>
      <a href="#/mentors" data-nav="mentors">

        <span data-i="nav_mentors"></span>
      </a>
    </div>
  </nav>

  <noscript><p style="padding:16px">Pathfinder needs JavaScript to run. Please turn it on in your browser.</p></noscript>

  <script src="/js/i18n.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>

</html>
